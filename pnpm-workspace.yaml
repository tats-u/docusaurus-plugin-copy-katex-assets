publicHoistPattern:
  - "@rspack/core"
packages:
  - "packages/@tats-u/docusaurus-plugin-copy-katex-assets"
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
trustPolicyExcludePrune: true
trustPolicyExclude:
  - webpack-dev-middleware@7.4.6
blockExoticSubdeps: true
allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: true
overrides:
  webpack-dev-server@5>sockjs: "-"
  serialize-javascript@^6: ^7.0.4
  # Tinypool 2 drops Node 18; the test site runs on Node 22+ in CI.
  '@docusaurus/core@^3.9.2>tinypool@^1': ^2.2.0
  # Keep the test site's renderer and copied CSS on the same KaTeX version.
  # The site uses neither __defineFunction nor custom internal CSS selectors.
  katex@^0.16: ^0.18.2
  # Webpackbar 7 separates its options from ProgressPlugin's validated options.
  '@docusaurus/bundler@^3.9.2>webpackbar@^6': ^7.0.0
auditConfig:
  # deepmerge false positive; CVE-2026-93753 was rejected.
  # https://github.com/github/advisory-database/issues/10910
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
