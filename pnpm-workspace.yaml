publicHoistPattern:
  - "@rspack/core"
packages:
  - "packages/@tats-u/docusaurus-plugin-copy-katex-assets"
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
trustPolicyExcludePrune: true
trustPolicyExclude:
  - webpack-dev-middleware@7.4.6
blockExoticSubdeps: true
allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: true
overrides:
  webpack-dev-server@5>sockjs: "-"
  serialize-javascript@^6: ^7.0.4
